# BoliFlow — single-client deployment (app + PostgreSQL).
#
#   cp .env.example .env        # fill in the values
#   docker compose up -d        # build + start
#   docker compose exec app sh scripts/docker-entrypoint.sh   # db push + seed
#
# The app is served on http://<host>:8080; put a reverse proxy (Caddy/Nginx)
# in front for TLS + the client's custom domain.

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-oceanatlas.mv}
      PORT: 3000
    ports:
      - "8080:3000"
    volumes:
      - app-data:/app/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boliflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-boliflow}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boliflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app-data:
  db-data:
